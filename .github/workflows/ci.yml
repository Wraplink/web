name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository lint audit
        continue-on-error: true
        run: npm run lint

      - name: Verify backend integration files
        run: >-
          npx eslint
          src/lib/auth.ts
          src/lib/api/client.ts
          src/lib/api/auth.ts
          src/lib/api/connection.ts
          src/lib/api/usage.ts
          src/components/auth/AuthGuard.tsx
          src/components/auth/LoginContent.tsx
          src/components/layout/UserSidebar.tsx
          src/components/bandwidth/BandwidthContent.tsx
          src/hooks/useConnectionRealtime.ts

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:7080
        run: npm run build
